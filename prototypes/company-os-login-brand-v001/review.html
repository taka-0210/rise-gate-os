<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="prototype-id" content="company-os-login-brand-v001-review">
<title>Company OS Login｜Human Visual Review</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#eef8fa;background:#0b1926;font-family:"Yu Gothic",sans-serif}.review-header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 24px;border-bottom:1px solid #30485a}.review-header p{margin:0;color:#77d9d7;font-size:10px;font-weight:800;letter-spacing:.16em}.review-header h1{margin:5px 0 0;font-size:18px}.controls{display:flex;gap:8px}.controls button,.controls a{padding:10px 14px;border:1px solid #476277;border-radius:4px;color:#eaf6f8;background:#142739;font:700 11px/1.2 inherit;text-decoration:none;cursor:pointer}.controls button[aria-pressed="true"]{border-color:#77d9d7;color:#092334;background:#77d9d7}.stage-shell{padding:24px}.stage{width:100%;height:calc(100vh - 117px);margin:auto;border:1px solid #32495a;background:#eef3f5;transition:width .2s ease,height .2s ease}.stage iframe{display:block;width:100%;height:100%;border:0;background:#fff}@media(max-width:760px){.review-header{align-items:flex-start;flex-direction:column}.stage-shell{padding:10px}.stage{height:calc(100vh - 166px)}}
</style>
</head>
<body>
<header class="review-header">
<div><p>ISOLATED VISUAL PROTOTYPE</p><h1>Company OS Login｜Brand Direction Review</h1></div>
<nav class="controls" aria-label="Viewport controls">
<button type="button" data-width="100%" data-height="calc(100vh - 117px)" aria-pressed="true">Desktop 1440×900</button>
<button type="button" data-width="390px" data-height="844px" aria-pressed="false">Mobile 390×844</button>
<a href="index.html" target="_blank" rel="noopener">新しいTabで開く</a>
</nav>
</header>
<main class="stage-shell"><div class="stage"><iframe src="index.html" title="Company OS Login Visual Prototype"></iframe></div></main>
<script>
const stage=document.querySelector(".stage");
document.querySelectorAll("button[data-width]").forEach(function(button){
button.addEventListener("click",function(){
document.querySelectorAll("button[data-width]").forEach(function(item){item.setAttribute("aria-pressed","false");});
button.setAttribute("aria-pressed","true");
stage.style.width=button.dataset.width;
stage.style.height=button.dataset.height;
});
});
</script>
</body>
</html>
