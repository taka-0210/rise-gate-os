<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="prototype-id" content="company-os-login-brand-v001">
<title>Company OS Login｜Brand Visual Prototype</title>
<link rel="stylesheet" href="brand.css">
</head>
<body>
<div class="prototype-notice" role="note"><span>VISUAL PROTOTYPE</span><span>AUTH NOT CONNECTED</span></div>
<div class="page-shell">
<header class="site-header">
<a class="brand-mark" href="#main" aria-label="Company OS ログインへ"><span class="brand-dot" aria-hidden="true"></span><span>Company OS</span></a>
<p>SECURE COMPANY ACCESS</p>
</header>
<main id="main" class="login-composition">
<section class="login-content" aria-labelledby="brand-title">
<p class="eyebrow">THE OPERATING SYSTEM FOR YOUR COMPANY</p>
<h1 id="brand-title"><span>Company</span><span>OS</span></h1>
<p class="brand-statement">次世代の経営指針。</p>
<p class="brand-description">会社そのものをデジタル上に構造化し、<br>その会社を理解するAIとともに経営する。</p>
<form class="login-form" aria-label="ログイン（Visual Prototype）" action="#" onsubmit="return false">
<div class="form-heading">
<div><p class="form-kicker">COMPANY ACCESS</p><h2>会社へログイン</h2></div>
<span>01</span>
</div>
<label for="email">メールアドレス</label>
<input id="email" name="email" type="email" autocomplete="username" placeholder="name@example.com">
<label for="password">パスワード</label>
<input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••">
<div class="form-options">
<label class="remember"><input type="checkbox" name="remember"> ログイン状態を保持</label>
<a href="#prototype-note">パスワードを忘れた方</a>
</div>
<button type="submit">ログイン <span aria-hidden="true">→</span></button>
<p id="prototype-note" class="prototype-copy">Prototypeのため、認証・送信は行いません。</p>
</form>
</section>
<aside class="brand-visual" aria-hidden="true">
<div class="visual-wash"></div>
<img src="../../public/images/company-os-brand-symbol.svg" alt="">
<div class="visual-axis"><span>PAST</span><i></i><span class="active">NOW</span><i></i><span>FUTURE</span></div>
</aside>
</main>
<footer><span>Company OS</span><span>PRIVATE / AUTHENTICATED SPACE</span></footer>
</div>
</body>
</html>
