name: 本番へデプロイ

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: '承認済RC artifactを作成したActions run ID'
        required: true
        type: string
      rc_sha:
        description: '承認済み40桁RC SHA'
        required: true
        type: string
      artifact_sha256:
        description: '承認済みartifact SHA-256'
        required: true
        type: string
      release_case:
        description: 'G12で承認されたRelease case ID'
        required: true
        type: string
      migration_manifest_sha256:
        description: '承認済みMigration Manifest SHA-256'
        required: true
        type: string
      verification_manifest_sha256:
        description: '承認済みVerification Manifest SHA-256'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: rise-gate-os-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 承認済みartifactをXServerへ反映
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_BASE_URL }}
    steps:
      - name: Release入力とProduction profileをfail-closed検証
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RC_SHA: ${{ inputs.rc_sha }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          RELEASE_CASE: ${{ inputs.release_case }}
          MIGRATION_MANIFEST_SHA256: ${{ inputs.migration_manifest_sha256 }}
          VERIFICATION_MANIFEST_SHA256: ${{ inputs.verification_manifest_sha256 }}
          RELEASES_ROOT: ${{ vars.XSERVER_RELEASES_ROOT }}
          SHARED_ROOT: ${{ vars.XSERVER_SHARED_ROOT }}
          CURRENT_LINK: ${{ vars.XSERVER_CURRENT_LINK }}
          UPLOAD_DIR: ${{ vars.XSERVER_RELEASE_UPLOAD_DIR }}
          PHP_BIN: ${{ vars.XSERVER_PHP_BIN }}
          BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RC_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$MIGRATION_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$VERIFICATION_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_CASE" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$BASE_URL" =~ ^https://[^/]+/?$ ]]
          for path in "$RELEASES_ROOT" "$SHARED_ROOT" "$CURRENT_LINK" "$UPLOAD_DIR" "$PHP_BIN"; do
            [[ "$path" == /* && "$path" != '/' ]]
            [[ "$path" =~ ^/[A-Za-z0-9._/-]+$ ]]
          done

      - name: 固定RCのdeploy toolingを取得
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.rc_sha }}
          fetch-depth: 1

      - name: Checkoutを照合
        env:
          RC_SHA: ${{ inputs.rc_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RC_SHA"
          test -f deployment/deploy-release.sh
          test -f deployment/smoke-http.sh

      - name: PHP 8.3を準備
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Build済みの同一artifactを取得
        uses: actions/download-artifact@v5
        with:
          name: rise-gate-os-${{ inputs.rc_sha }}
          path: ${{ runner.temp }}/release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.release_run_id }}

      - name: artifactと承認Manifestを照合
        env:
          RC_SHA: ${{ inputs.rc_sha }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          MIGRATION_MANIFEST_SHA256: ${{ inputs.migration_manifest_sha256 }}
          VERIFICATION_MANIFEST_SHA256: ${{ inputs.verification_manifest_sha256 }}
          MIGRATION_MANIFEST_BASE64: ${{ secrets.IR1_MIGRATION_MANIFEST_BASE64 }}
          VERIFICATION_MANIFEST_BASE64: ${{ secrets.IR1_RELEASE_VERIFICATION_MANIFEST_BASE64 }}
        run: |
          artifact="$RUNNER_TEMP/release/rise-gate-os-${RC_SHA}.tar.gz"
          test -f "$artifact"
          test "$(sha256sum "$artifact" | awk '{print $1}')" = "$ARTIFACT_SHA256"
          test "$(cut -d' ' -f1 "$artifact.sha256")" = "$ARTIFACT_SHA256"
          printf '%s' "$MIGRATION_MANIFEST_BASE64" | base64 --decode > "$RUNNER_TEMP/migration-manifest.json"
          printf '%s' "$VERIFICATION_MANIFEST_BASE64" | base64 --decode > "$RUNNER_TEMP/verification-manifest.json"
          test "$(sha256sum "$RUNNER_TEMP/migration-manifest.json" | awk '{print $1}')" = "$MIGRATION_MANIFEST_SHA256"
          test "$(sha256sum "$RUNNER_TEMP/verification-manifest.json" | awk '{print $1}')" = "$VERIFICATION_MANIFEST_SHA256"

      - name: SSHを安全に準備
        env:
          SSH_PRIVATE_KEY: ${{ secrets.XSERVER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.XSERVER_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/xserver_deploy_key
          chmod 600 ~/.ssh/xserver_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 承認済み入力だけを非公開領域へ転送
        env:
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
          RC_SHA: ${{ inputs.rc_sha }}
          RELEASE_CASE: ${{ inputs.release_case }}
          UPLOAD_DIR: ${{ vars.XSERVER_RELEASE_UPLOAD_DIR }}
        run: |
          remote_prefix="${UPLOAD_DIR%/}/${RELEASE_CASE}-${RC_SHA}"
          scp -4 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -P 10022 -i ~/.ssh/xserver_deploy_key \
            "$RUNNER_TEMP/release/rise-gate-os-${RC_SHA}.tar.gz" "${XSERVER_USER}@${XSERVER_HOST}:${remote_prefix}.tar.gz"
          scp -4 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -P 10022 -i ~/.ssh/xserver_deploy_key \
            "$RUNNER_TEMP/migration-manifest.json" "${XSERVER_USER}@${XSERVER_HOST}:${remote_prefix}.migrations.json"
          scp -4 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -P 10022 -i ~/.ssh/xserver_deploy_key \
            "$RUNNER_TEMP/verification-manifest.json" "${XSERVER_USER}@${XSERVER_HOST}:${remote_prefix}.verification.json"

      - name: 独立Gate付きRelease切替
        env:
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
          RC_SHA: ${{ inputs.rc_sha }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          RELEASE_CASE: ${{ inputs.release_case }}
          MIGRATION_MANIFEST_SHA256: ${{ inputs.migration_manifest_sha256 }}
          VERIFICATION_MANIFEST_SHA256: ${{ inputs.verification_manifest_sha256 }}
          RELEASES_ROOT: ${{ vars.XSERVER_RELEASES_ROOT }}
          SHARED_ROOT: ${{ vars.XSERVER_SHARED_ROOT }}
          CURRENT_LINK: ${{ vars.XSERVER_CURRENT_LINK }}
          UPLOAD_DIR: ${{ vars.XSERVER_RELEASE_UPLOAD_DIR }}
          PHP_BIN: ${{ vars.XSERVER_PHP_BIN }}
        run: |
          remote_prefix="${UPLOAD_DIR%/}/${RELEASE_CASE}-${RC_SHA}"
          printf -v remote_command 'bash -s -- %q %q %q %q %q %q %q %q %q %q %q %q %q' \
            "$RC_SHA" "$ARTIFACT_SHA256" "${remote_prefix}.tar.gz" "$RELEASE_CASE" \
            "$RELEASES_ROOT" "$SHARED_ROOT" "$CURRENT_LINK" "$PHP_BIN" \
            "${remote_prefix}.migrations.json" "$MIGRATION_MANIFEST_SHA256" \
            "${remote_prefix}.verification.json" "$VERIFICATION_MANIFEST_SHA256" production
          ssh -4 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -p 10022 -i ~/.ssh/xserver_deploy_key \
            "${XSERVER_USER}@${XSERVER_HOST}" "$remote_command" < deployment/deploy-release.sh

      - name: 公開HTTP Gate
        env:
          BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: bash deployment/smoke-http.sh "$BASE_URL" "$RUNNER_TEMP/verification-manifest.json"
